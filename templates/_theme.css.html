<style>
  /* Shared design tokens and base components for app.html and login.html.
     Kept as a Jinja include rather than a static file so the app stays
     build-step free and needs no cache-busting. */
  :root {
    color-scheme: dark;

    --bg: #050505;
    --panel: rgba(14, 14, 16, 0.95);
    --panel-2: rgba(28, 29, 33, 0.98);
    --panel-3: rgba(40, 41, 46, 0.96);
    --border: rgba(196, 150, 54, 0.38);
    --border-soft: rgba(196, 150, 54, 0.18);

    --text: #f5ecd7;
    --muted: #c4ae7d;
    --accent: #d7aa43;
    --accent-strong: #ffd978;
    --accent-dim: rgba(215, 170, 67, 0.14);

    --good: #4ade80;
    --bad: #fb7185;
    --warn: #f59e0b;
    /* Alias kept so login markup can migrate independently. */
    --danger: var(--bad);

    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 18px;

    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 24px;

    --shadow-1: 0 8px 24px rgba(0, 0, 0, 0.32);
    --shadow-2: 0 18px 60px rgba(0, 0, 0, 0.45);

    --tap: 48px;
    --maxw: 480px;

    --font-mono: "Courier New", "Lucida Console", monospace;
    /* Tabular figures: digits keep their column on every poll tick instead of
       jittering the way a proportional serif did. */
    --font-num: ui-monospace, "Cascadia Mono", "Segoe UI Mono", Consolas, "Courier New", monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: var(--font-mono);
    letter-spacing: 0.03em;
    color: var(--text);
    background:
      radial-gradient(circle at top, rgba(214, 174, 72, 0.13), transparent 34%),
      repeating-linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.012) 0,
        rgba(255, 255, 255, 0.012) 1px,
        transparent 1px,
        transparent 4px
      ),
      linear-gradient(180deg, #0f1012 0%, var(--bg) 100%);
    background-attachment: fixed;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background: radial-gradient(circle at 50% 20%, transparent 42%, rgba(0, 0, 0, 0.28) 100%);
  }

  h1, h2, h3 {
    margin: 0;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  a { color: var(--accent-strong); }

  button, input, select, textarea {
    font-family: var(--font-mono);
    letter-spacing: 0.03em;
    font-size: 1rem;
  }

  button {
    min-height: var(--tap);
    padding: 0 var(--space-4);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--panel-2);
    color: var(--text);
    cursor: pointer;
    transition: border-color 120ms ease, background 120ms ease, transform 80ms ease;
  }
  button:hover:not(:disabled) { border-color: var(--accent); background: var(--panel-3); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }

  button.primary {
    border-color: rgba(255, 232, 168, 0.58);
    background: linear-gradient(180deg, rgba(255, 213, 102, 0.98), rgba(208, 149, 33, 0.98));
    color: #1a1304;
    font-weight: 700;
  }
  button.primary:hover:not(:disabled) { background: linear-gradient(180deg, #ffe08a, #e0a52c); }

  button.danger {
    border-color: rgba(251, 113, 133, 0.5);
    background: rgba(127, 29, 29, 0.28);
    color: #fecdd3;
  }
  button.danger:hover:not(:disabled) { background: rgba(127, 29, 29, 0.45); }

  button.ghost { background: transparent; }

  :focus-visible {
    outline: 2px solid var(--accent-strong);
    outline-offset: 2px;
  }

  input[type="text"],
  input[type="password"],
  input[type="number"],
  select {
    width: 100%;
    min-height: var(--tap);
    padding: 0 var(--space-3);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--panel-2);
    color: var(--text);
  }
  input:focus, select:focus { border-color: var(--accent); }

  .panel {
    position: relative;
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    background: var(--panel);
    padding: var(--space-4);
    box-shadow: var(--shadow-1);
  }
  .panel > h2 {
    font-size: 0.78rem;
    color: var(--muted);
    margin-bottom: var(--space-3);
  }

  .num {
    font-family: var(--font-num);
    font-variant-numeric: tabular-nums;
  }

  .muted { color: var(--muted); }
  .good { color: var(--good); }
  .bad { color: var(--bad); }
  .hidden { display: none !important; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }
  }
</style>
